[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catnip"
version = "0.1.0"
description = "CATNIP: level-1 phylogenetic network inference from gene trees"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "torch>=2.1", "networkx>=3"]

[project.optional-dependencies]
train = ["scipy==1.11.4", "numpy==1.26.4", "torch==2.5.1", "networkx==3.2.1"]

[project.scripts]
catnip = "catnip.infer:main"
catnip-train = "catnip.train:main"
catnip-prepare = "catnip.prepare:main"
catnip-evaluate = "catnip.evaluate:main"

[tool.setuptools]
packages = ["catnip"]

[tool.setuptools.package-data]
catnip = ["bin/*", "models/*.json", "licenses/*", "*.jl"]
